<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 512" role="img" aria-label="Patchwell">
  <title>Patchwell</title>
  
  <title>Patchwell</title>
  <!-- An invented mark for an invented IT helpdesk: a monogram P whose bowl
       is left open like a plug/port, with a single teal "patch" square set
       into the gap. Nothing here is any real business's or platform's asset. -->
  <defs>
    <linearGradient id="pw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12213f"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#pw-bg)"/>
  <path d="M166 392V126h118a84 84 0 0 1 0 168h-72" fill="none" stroke="#f4f7f5" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="318" y="318" width="74" height="74" rx="18" fill="#14a38b"/>

  <text x="596" y="292" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="150"
        font-weight="600" letter-spacing="-4" fill="#f4f7f5">Patchwell</text>
  <text x="600" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="62" letter-spacing="6" fill="#14a38b">IT HELPDESK FOR SMALL TEAMS, INSIDE SLACK.</text>
</svg>

# Demo-sized prefork MPM override for the wordpress:php8.3-apache image.
# The stock image ships Apache's own defaults (StartServers 5,
# MinSpareServers 5, MaxSpareServers 10, MaxRequestWorkers 150) — each idle
# prefork worker carries a full PHP interpreter (~15-20 MB RSS), so holding
# 8-11 idle workers open wastes real memory on the 2 GB demo demo host for
# traffic that is a handful of requests an hour. Mounted at
# conf-enabled/zz-mpm-demo.conf, which IncludeOptional's after mods-enabled
# (where mpm_prefork.conf sets the defaults this overrides) and before
# sites-enabled.
# busymate-devtools#2989 (this box's 2 GB RAM reclaim).
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       20
    MaxConnectionsPerChild  1000
</IfModule>

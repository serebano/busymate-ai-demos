; Demo-sized opcache override for the wordpress:php8.3-apache image.
; The stock image ships conf.d/opcache-recommended.ini at
; opcache.memory_consumption=128 — sized for real production traffic, not a
; brochure/shop demo with a handful of plugins. Mounted at
; conf.d/zz-opcache-demo.ini so it sorts (and loads) AFTER
; opcache-recommended.ini and wins.
; busymate-devtools#2989 (this box's 2 GB RAM reclaim).
opcache.memory_consumption=48
opcache.max_accelerated_files=3000
opcache.interned_strings_buffer=8
opcache.validate_timestamps=1
opcache.revalidate_freq=60

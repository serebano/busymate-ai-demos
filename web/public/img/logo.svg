<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 512" role="img" aria-label="Northwind Coffee Co.">
  <title>Northwind Coffee Co.</title>
  
  <title>Northwind Coffee</title>
  <!-- An invented mark for an invented roaster: a compass needle pointing north.
       North is filled, south is drawn, so the pair also reads as a coffee bean
       split down its seam. Nothing here is any real company's asset. -->
  <defs>
    <linearGradient id="nw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4b26"/>
      <stop offset="1" stop-color="#33200f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#nw-bg)"/>
  <path d="M256 88 L340 284 L256 246 L172 284 Z" fill="#e6a352"/>
  <path d="M172 284 L256 246 L340 284 L256 424 Z"
        fill="none" stroke="#f6e9d8" stroke-width="26" stroke-linejoin="round"/>

  <text x="596" y="292" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="150"
        font-weight="600" letter-spacing="-4" fill="#f6e9d8">Northwind Coffee</text>
  <text x="600" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="62" letter-spacing="6" fill="#c9822f">SMALL-BATCH COFFEE, ROASTED TO ORDER</text>
</svg>
